name: Deploy

# Cada push a main construye la imagen aquí (el VPS no compila nada), la sube por SSH
# y recrea SOLO el servicio `api` del stack `adnwebs`. No toca web, base de datos ni had_*.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps-api
  cancel-in-progress: false

env:
  IMAGE: localhost/adnwebs-api:latest

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build -t "$IMAGE" .

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Remember previous image
        run: |
          old=$(ssh -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/deploy_key \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'docker image inspect --format "{{.Id}}" localhost/adnwebs-api:latest 2>/dev/null || true')
          echo "OLD_IMAGE=$old" >> "$GITHUB_ENV"

      - name: Upload image
        run: |
          docker save "$IMAGE" | gzip | ssh -o BatchMode=yes -o IdentitiesOnly=yes \
            -i ~/.ssh/deploy_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" 'gunzip | docker load'

      - name: Recreate api
        run: |
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/deploy_key \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'cd ~/adnwebs && docker compose -p adnwebs up -d api && docker compose -p adnwebs ps api'

      - name: Health check
        run: |
          for i in $(seq 1 12); do
            code=$(ssh -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/deploy_key \
              "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
              'curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:6001/api/projects/public' || true)
            echo "intento $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 5
          done
          echo "La API no respondió 200 tras el despliegue" >&2
          exit 1

      - name: Remove previous image
        if: success()
        run: |
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/deploy_key \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "old='$OLD_IMAGE'; new=\$(docker image inspect --format '{{.Id}}' localhost/adnwebs-api:latest); [ -n \"\$old\" ] && [ \"\$old\" != \"\$new\" ] && docker rmi \"\$old\" || true"

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key
